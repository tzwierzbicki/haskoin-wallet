# What sets haskoin-wallet apart for haskell-dev, the development loop of
# https://github.com/jprupp/tools: `haskell-dev build`, `test` and `docs`.

# The spec modules that take most of the time of the tests: they run the hw
# binary, or live regtest chains. Each of their groups is run apart, so that
# the test processes share them evenly. A group of the regtest specs starts
# a container of its own, so several of them run at once too.
slow-specs = ["*.Workflow.*", "*.Regtest.*"]

# The modules persistent generates the declarations of. Haddock has no place
# in a page for the constructors of their keys and columns, and says so for
# each one: the check of the documentation leaves those warnings out.
generated-modules = ["Haskoin.Wallet.Database.Schema.V*"]
