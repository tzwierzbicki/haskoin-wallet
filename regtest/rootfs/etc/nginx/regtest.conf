# The proxy of the regtest container. hw asks one host for every network,
# each at the path of its name, and a haskoin-store serves one network at
# the root. So this puts the two stores under one host:
#
#   /btcreg/...  the store of the Bitcoin Core regtest chain
#   /bchreg/...  the store of the Bitcoin Cash Node regtest chain
#
# Any other path is answered 404, as the public server answers for a
# network it does not serve.
worker_processes 1;
pid /run/regtest/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
  access_log /var/log/regtest/proxy-access.log;
  # the store sends long answers while it reads them
  proxy_buffering off;
  proxy_http_version 1.1;
  proxy_read_timeout 300s;
  client_max_body_size 64m;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;
  server {
    listen 3000;
    location /btcreg/ { proxy_pass http://127.0.0.1:3001/; }
    location /bchreg/ { proxy_pass http://127.0.0.1:3002/; }
    location / {
      default_type application/json;
      return 404 '{"error":"Not Found"}';
    }
  }
}
