# The resolver is the one of haskoin-core
resolver: nightly-2026-10-28
nix:
  packages:
  - zlib
  - secp256k1
  - pkg-config
extra-deps:
  # The local checkouts, for haskoin-core 1.6.0 and haskoin-store-data 1.7.0,
  # the versions with the fixes of the November 2026 security review: pin
  # the commits of jprupp's master again once they are merged there
  - ../haskoin-core
  - ../haskoin-store/data
  - git: https://github.com/jprupp/secp256k1-haskell.git
    commit: 29e7ca97790254a4f1b4608733fd92473ff0bf27
  - base16-2.0
