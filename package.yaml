name: haskoin-wallet
version: 0.10.0
synopsis: Lightweight CLI wallet for Bitcoin and Bitcoin Cash
description:
  A command-line wallet for Bitcoin and Bitcoin Cash, made for cold storage.
  It derives BIP44 accounts with legacy addresses and BIP84 accounts with
  native SegWit addresses, from a BIP39 mnemonic or from SLIP39 shares. The
  mnemonic can stay on an offline computer, which signs the payments that an
  online computer prepares and sends. The online computer asks a haskoin-store
  server about the chain. It also reads and writes PSBT files, and offers coin
  control, fee bumping, sweeps, message signing, and labels in the BIP 329
  format.
category: Bitcoin, Finance, Network
author: JP Rupp
maintainer: jprupp@protonmail.ch
license: MIT
license-file: LICENSE
github: haskoin/haskoin-wallet.git
homepage: http://github.com/jprupp/haskoin-wallet
bug-reports: http://github.com/jprupp/haskoin-wallet/issues
extra-source-files:
  - CHANGELOG.md
  - fonts/*.ttf
  - fonts/LICENSE
  - fonts/README.md
  - test/data/bip329/*.jsonl
  - test/data/bip329/README.md
  - test/data/descriptors/*.json
  - test/data/descriptors/README.md
  - test/data/message-signing/*.json
  - test/data/message-signing/README.md
  - test/data/psbt/README.md
  - test/data/psbt/core/*.hex
  - test/data/psbt/core/*.psbt
  - test/data/tx-signing/*.json
  - test/data/tx-signing/README.md
  - test/data/tx-sweep/*.json
  - test/data/tx-sweep/README.md
dependencies:
  - base >=4.9 && <5
  - aeson >= 1.4.6.0
  - ansi-terminal >= 1.0
  - aeson-pretty >= 0.8.8
  - base16-bytestring >= 1.0.0.0
  - base64-bytestring >= 1.0.0.3
  - bytestring >= 0.10.10.0
  - cereal >= 0.5.8.1
  - conduit >= 1.3.5
  - containers >= 0.6.2.1
  - crypton >= 1.0.0
  - data-default >= 0.7.1.1
  # The width of text on a terminal, wide characters counted twice: see
  # Haskoin.Wallet.Cli.PrettyPrinter
  - doclayout >= 0.5
  - directory >= 1.3.6.0
  - Decimal >= 0.5.1
  - entropy >= 0.4.1.6
  - filepath >= 1.4
  - path-pieces
  - http-api-data
  - esqueleto >=3.5.10.1
  # From 2.0.0, no function takes a secp256k1 context: the library keeps
  # one for the whole process. From 3.0.0, it reads the token prefix of an
  # output of Bitcoin Cash (hasTokenPrefix, splitTokenData), which tells
  # hw the coins it must never spend.
  - haskoin-core >= 3.0.0
  # The API of the store in JSON alone: ApiResponse reads an answer, and
  # PostTx sends a transaction in hex. From 2.0.1, its readers refuse what
  # they cannot read when they read it, and pathEncodes tells whether the
  # path of a request can be written. From 3.0.0, it is built on
  # haskoin-core 2.0.0 and takes no context either. From 4.0.0, it is built
  # on haskoin-core 3.0.0, and a coin of Bitcoin Cash that holds tokens
  # keeps its token prefix in its script.
  - haskoin-store-data >= 4.0.0
  - http-client >= 0.7
  - http-types >= 0.12.3
  - lens >= 4.18.1
  - lens-aeson >= 1.1
  - monad-logger >= 0.3.40
  - mtl >= 2.2.2
  - optparse-applicative >= 0.15.1.0
  - persistent >= 2.14.5.1
  - persistent-sqlite >= 2.13.1.1
  - pretty >= 1.1.3.6
  - process >= 1.6
  - prettyprinter >= 1.7
  - prettyprinter-ansi-terminal >= 1.1
  - qrcode-core >= 0.9.12
  - random >= 1.1
  - raw-strings-qq >= 1.1
  - secp256k1-haskell >= 2.0.0
  - split >= 0.2.3.5
  - string-conversions >= 0.4.0.1
  # The font files of the PDF reports are compiled into hw: see
  # Haskoin.Wallet.Report.Font. It comes with the compiler.
  - template-haskell
  - text >= 1.2.4.0
  # The configuration file: its reader, and the places of its values,
  # which setdefault needs to change one of them and keep the comments:
  # see Haskoin.Wallet.TomlEdit
  - toml-parser >= 2.0.2.0
  # The height of the terminal, which tells the pager how to show a table:
  # see Haskoin.Wallet.Cli.Pager
  - terminal-size >= 0.3
  - time >= 1.12.2
  # The failure of a TLS handshake, which tells a host hw could not reach:
  # see Haskoin.Wallet.Store
  - tls >= 2.0
  - unicode-transforms >= 0.4
  - unix >= 2.8
  - transformers >= 0.5.6.2
  - unliftio >= 0.2.10
  - unordered-containers >= 0.2.10.0
  - wreq >= 0.5.3.2
  # The zip file that holds an OpenDocument spreadsheet, which exportsheet
  # writes: see Haskoin.Wallet.Cli.Ods
  - zip-archive >= 0.4
library:
  source-dirs: src
  ghc-options: -Wall
executables:
  hw:
    main: Main.hs
    source-dirs: app
    ghc-options: -Wall
    dependencies:
      - haskoin-wallet
tests:
  spec:
    main: Spec.hs
    source-dirs: test
    # The tests of whole workflows run the hw of this build: see
    # Haskoin.Wallet.HwTestUtils
    verbatim:
      build-tool-depends:
        hspec-discover:hspec-discover, haskoin-wallet:hw
    # Threaded: the lock tests hold the database from one thread while
    # another waits on it inside SQLite
    ghc-options: -Wall -threaded
    dependencies:
      - haskoin-wallet
      - hspec >= 2.7.1
      - QuickCheck >= 2.13.2
      - HUnit >= 1.6.0.0
      - crypton >= 1.1
      - podman-test >= 0.1.0
      - typed-process >= 0.2.6
      - wai >= 3.2
      - warp >= 3.3
