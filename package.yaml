name: haskoin-wallet
version: 0.10.0
synopsis: Lightweight CLI wallet for Bitcoin and Bitcoin Cash
description:
  Lightweight command-line interface offline-friendly 
  hierarchical-deterministic BTC/BCH wallet compatible with 
  BIP44 and BIP39.
category: Bitcoin, Finance, Network
author: JP Rupp
maintainer: jprupp@protonmail.ch
license: PublicDomain
license-file: UNLICENSE
github: haskoin/haskoin-wallet.git
homepage: http://github.com/jprupp/haskoin-wallet
bug-reports: http://github.com/jprupp/haskoin-wallet/issues
extra-source-files:
  - test/data/message-signing/*.json
  - test/data/message-signing/README.md
  - test/data/tx-signing/*.json
  - test/data/tx-signing/README.md
  - test/data/tx-sweep/*.json
  - test/data/tx-sweep/README.md
dependencies:
  - base >=4.9 && <5
  - aeson >= 1.4.6.0
  - ansi-terminal >= 1.0
  - aeson-pretty >= 0.8.8
  - base16-bytestring >= 1.0.0.0
  - base64-bytestring >= 1.0.0.3
  - bytestring >= 0.10.10.0
  - cereal >= 0.5.8.1
  - conduit >= 1.3.5
  - containers >= 0.6.2.1
  - data-default >= 0.7.1.1
  - deepseq >= 1.4
  - directory >= 1.3.6.0
  - Decimal >= 0.5.1
  - entropy >= 0.4.1.6
  - filepath >= 1.4
  - path-pieces
  - http-api-data
  - esqueleto >=3.5.10.1
  - haskoin-core >= 1.0.4
  - haskoin-store-data >= 1.2.2
  - http-client >= 0.7
  - http-types >= 0.12.3
  - lens >= 4.18.1
  - lens-aeson >= 1.1
  - monad-logger >= 0.3.40
  - mtl >= 2.2.2
  - optparse-applicative >= 0.15.1.0
  - persistent >= 2.14.5.1
  - persistent-sqlite >= 2.13.1.1
  - pretty >= 1.1.3.6
  - prettyprinter >= 1.7
  - prettyprinter-ansi-terminal >= 1.1
  - random >= 1.1
  - raw-strings-qq >= 1.1
  - secp256k1-haskell >= 1.1.0
  - split >= 0.2.3.5
  - string-conversions >= 0.4.0.1
  - text >= 1.2.4.0
  - time >= 1.12.2
  - unicode-transforms >= 0.4
  - unix >= 2.7
  - transformers >= 0.5.6.2
  - unliftio >= 0.2.10
  - unordered-containers >= 0.2.10.0
  - wreq >= 0.5.3.2
library:
  source-dirs: src
  ghc-options: -Wall
executables:
  hw:
    main: Main.hs
    source-dirs: app
    ghc-options: -Wall
    dependencies:
      - haskoin-wallet
tests:
  spec:
    main: Spec.hs
    source-dirs: test
    # The tests of whole workflows run the hw of this build: see
    # Haskoin.Wallet.HwTestUtils
    verbatim:
      build-tool-depends:
        hspec-discover:hspec-discover, haskoin-wallet:hw
    # Threaded: the lock tests hold the database from one thread while
    # another waits on it inside SQLite
    ghc-options: -Wall -threaded
    dependencies:
      - haskoin-wallet
      - hspec >= 2.7.1
      - QuickCheck >= 2.13.2
      - HUnit >= 1.6.0.0
      - crypton >= 1.1
      - bytes >= 0.17
      - typed-process >= 0.2.6
      - wai >= 3.2
      - warp >= 3.3
